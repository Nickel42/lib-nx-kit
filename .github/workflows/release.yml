name: Release

# Push a tag such as v0.1.0 to publish. The workflow tests and packs the library with that version and
# attaches the packages to a GitHub release. If the NUGET_USER repository variable is set (the nuget.org
# profile name that owns the package), it also pushes them to nuget.org with Trusted Publishing: GitHub
# issues a short-lived OIDC token, nuget.org exchanges it for a one-hour API key, and no long-lived key is
# stored anywhere. The nuget.org policy must name this repository, the workflow file release.yml and the
# environment nuget. See CONTRIBUTING.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  pack:
    name: Test and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Test
        run: dotnet test lib-nx-kit.sln -c Release
      - name: Pack
        run: dotnet pack lib-nx-kit.sln -c Release -o artifacts -p:Version=${VERSION:-0.0.0-dev}
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*

  github-release:
    name: GitHub release
    needs: pack
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  nuget:
    name: nuget.org
    needs: pack
    if: startsWith(github.ref, 'refs/tags/v') && vars.NUGET_USER != ''
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write # lets this job, and only this job, request the OIDC token nuget.org trusts
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts
      - name: NuGet login (OIDC → one-hour API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
